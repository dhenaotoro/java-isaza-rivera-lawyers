version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: isaza-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: legaldb
      MYSQL_USER: legal_user
      MYSQL_PASSWORD: legal_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - legal-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isaza-api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/legaldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: legal_user
      SPRING_DATASOURCE_PASSWORD: legal_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - legal-network

volumes:
  mysql_data:

networks:
  legal-network:
    driver: bridge
